    let activePubCategory = 'all';

    function renderPublications() {
      const container = document.getElementById('publications-container');
      const query = (document.getElementById('pub-search-input')?.value || '').toLowerCase().trim();

      const filtered = publicationsData.filter(pub => {
        const matchesCat = activePubCategory === 'all' || pub.category === activePubCategory;
        const matchesQuery = !query || pub.title.toLowerCase().includes(query) || pub.venue.toLowerCase().includes(query) || pub.authors.toLowerCase().includes(query) || pub.year.includes(query);
        return matchesCat && matchesQuery;
      });

      if (filtered.length === 0) {
        container.innerHTML = `<div class="p-6 text-center text-gray-500 italic">No publications matched your search.</div>`;
        return;
      }

      container.innerHTML = filtered.map((pub, index) => {
        const linksArr = [];
        if (pub.arxiv) linksArr.push(`<a href="https://arxiv.org/abs/${pub.arxiv}" target="_blank" class="text-blue-400 hover:underline whitespace-nowrap">[arXiv]</a>`);
        if (pub.atel) linksArr.push(`<a href="https://www.astronomerstelegram.org/?read=${pub.atel}" target="_blank" class="text-blue-400 hover:underline whitespace-nowrap">[ATel]</a>`);
        if (pub.ads) linksArr.push(`<a href="${pub.ads}" target="_blank" class="text-blue-400 hover:underline whitespace-nowrap">[NASA ADS]</a>`);
        const linksHtml = linksArr.length > 0 ? `&nbsp; ${linksArr.join(' ')}` : '';

        const venueHtml = pub.doi && pub.doi !== '' 
          ? `<a href="${pub.doi}" target="_blank" class="italic text-blue-400 hover:underline">${pub.venue}</a>`
          : `<span class="italic text-gray-300">${pub.venue}</span>`;

        return `
          <div class="mb-8 pb-8 border-b border-gray-700 last:border-0 last:pb-0 last:mb-0">
            <h3 class="font-bold text-2xl text-white mb-1">${index + 1}. ${pub.title}</h3>
            <p class="text-gray-400 mb-1">${pub.authors}</p>
            <p class="text-gray-500">
              ${venueHtml} (${pub.year}) ${linksHtml}
            </p>
          </div>
        `;
      }).join('');
    }

    function setPubCategory(cat) {
      activePubCategory = cat;
      document.querySelectorAll('.pub-tab').forEach(btn => {
        btn.className = 'pub-tab px-4 py-2 text-lg font-bold border border-gray-600 hover:bg-gray-700 transition bg-gray-800 text-gray-300';
      });
      document.getElementById(`pub-tab-${cat}`).className = 'pub-tab active px-4 py-2 text-lg font-bold border border-blue-500 transition shadow-sm';
      renderPublications();
    }

    function filterPublications() { renderPublications(); }

    window.onload = function () {
      renderPublications();
    };

    // Interactive Constellation Starfield Background (AAS.org style)
    const canvas = document.getElementById('star-canvas');
    const ctx = canvas.getContext('2d');
    
    let width, height, particles;
    let mouse = { x: null, y: null, radius: 150 };

    window.addEventListener('mousemove', function(event) {
      mouse.x = event.x;
      mouse.y = event.y;
    });
    
    window.addEventListener('mouseout', function() {
      mouse.x = null;
      mouse.y = null;
    });

    window.addEventListener('resize', initCanvas);

    class Particle {
      constructor(x, y, dx, dy, size) {
        this.x = x;
        this.y = y;
        this.dx = dx;
        this.dy = dy;
        this.size = size;
      }
      draw() {
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2, false);
        ctx.fillStyle = 'rgba(255, 255, 255, 0.8)';
        ctx.fill();
      }
      update() {
        if (this.x > width || this.x < 0) this.dx = -this.dx;
        if (this.y > height || this.y < 0) this.dy = -this.dy;

        // Interaction
        if (mouse.x != null && mouse.y != null) {
          let dx = mouse.x - this.x;
          let dy = mouse.y - this.y;
          let distance = Math.sqrt(dx * dx + dy * dy);
          if (distance < mouse.radius) {
            const forceDirectionX = dx / distance;
            const forceDirectionY = dy / distance;
            const force = (mouse.radius - distance) / mouse.radius;
            this.x -= forceDirectionX * force * 2;
            this.y -= forceDirectionY * force * 2;
          }
        }
        
        this.x += this.dx;
        this.y += this.dy;
        this.draw();
      }
    }

    function initCanvas() {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
      particles = [];
      let numberOfParticles = (width * height) / 9000;
      for (let i = 0; i < numberOfParticles; i++) {
        let size = (Math.random() * 1.5) + 0.5;
        let x = (Math.random() * ((width - size * 2) - (size * 2)) + size * 2);
        let y = (Math.random() * ((height - size * 2) - (size * 2)) + size * 2);
        let dx = (Math.random() - 0.5) * 0.5;
        let dy = (Math.random() - 0.5) * 0.5;
        particles.push(new Particle(x, y, dx, dy, size));
      }
    }

    function animate() {
      requestAnimationFrame(animate);
      ctx.clearRect(0, 0, width, height);

      for (let i = 0; i < particles.length; i++) {
        particles[i].update();
      }
      connectParticles();
    }

    function connectParticles() {
      let opacityValue = 1;
      for (let a = 0; a < particles.length; a++) {
        for (let b = a; b < particles.length; b++) {
          let distance = ((particles[a].x - particles[b].x) * (particles[a].x - particles[b].x))
                       + ((particles[a].y - particles[b].y) * (particles[a].y - particles[b].y));
          if (distance < (width/7) * (height/7)) {
            opacityValue = 1 - (distance / 20000);
            ctx.strokeStyle = 'rgba(255, 255, 255, ' + opacityValue * 0.2 + ')';
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.moveTo(particles[a].x, particles[a].y);
            ctx.lineTo(particles[b].x, particles[b].y);
            ctx.stroke();
          }
        }
      }
    }

    initCanvas();
    animate();
